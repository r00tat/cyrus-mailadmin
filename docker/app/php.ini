; PHP settings for the test environment.

; U-14: one timezone everywhere. The application sets it in the front controller
; as well; this makes a CLI run agree with it before bootstrap.
date.timezone = UTC

; Show everything. This is a test environment — a notice that only appears in
; the log is a notice nobody reads.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; The build artefacts under var/cache are produced by `composer build`, not at
; request time (U-13). Revalidating on every request keeps a bind-mounted edit
; from being served stale.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Certificate verification is on, always (architecture 9.2). These point at the
; system trust store, into which the entrypoint installs the test CA — so a test
; never has to pass `verify_peer => false`, and one that did would be caught.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
openssl.capath = /etc/ssl/certs

memory_limit = 512M

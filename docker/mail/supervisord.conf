; Three processes in one container, as in production. Everything logs to the
; container's stdout, so `docker compose logs mail` is the single place to look
; when an authentication does not go through.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
loglevel = info

; Cyrus logs through syslog and there is no syslog daemon in a container, so
; without this every message imapd, timsieved and lmtpd produce is discarded —
; including the reason an authentication or a mailbox operation failed. busybox
; syslogd writes them to stdout, where `docker compose logs mail` picks them up.
;
; First in the list on purpose: it has to be listening before Cyrus starts.
[program:syslogd]
command = /sbin/syslogd -n -O /dev/stdout -S
autorestart = true
priority = 1
stdout_logfile = /dev/fd/1
stderr_logfile = /dev/fd/2
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:saslauthd]
; -a pam    the whole point: authentication goes through /etc/pam.d/<service>
;           and from there into pam_mysql
; -r        REQUIRED, and easy to miss. With `virtdomains` on, Cyrus splits a
;           login of the form `anna@example.test` and hands saslauthd
;           [user=anna] [realm=example.test]. pam_mysql then looks up `anna`,
;           which is in no row of `allusers`, and the login fails — while
;           `anna.example.test` works. -r puts the realm back on, so saslauthd
;           asks for `anna@example.test`.
;
;           That is exactly the pair of spellings the `allusers` view produces,
;           which is what the view is for. Without -r one of its two branches is
;           dead weight — and it is also the reason production can produce the
;           shadow mailboxes of finding S-13: there, the address form
;           authenticates and Cyrus then autocreates an empty mailbox for it.
; -d        foreground and verbose. In a test environment the log line naming
;           the user, the service and the reason is worth the noise.
; -n 2      two worker processes; enough, and keeps the log readable.
command = /usr/sbin/saslauthd -a pam -r -d -m /run/saslauthd -n 2
autorestart = true
priority = 10
stdout_logfile = /dev/fd/1
stderr_logfile = /dev/fd/2
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:cyrus]
command = /usr/sbin/cyrus master -D
autorestart = true
priority = 20
stdout_logfile = /dev/fd/1
stderr_logfile = /dev/fd/2
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:postfix]
command = /usr/sbin/postfix start-fg
autorestart = true
priority = 30
stdout_logfile = /dev/fd/1
stderr_logfile = /dev/fd/2
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

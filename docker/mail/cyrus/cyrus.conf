# Cyrus master — test environment.
#
# The services the application and the integration tests talk to, and nothing
# else. No POP3S, no NNTP, no notifyd: an unused listener is one more thing that
# can fail to start and make the environment look broken.

START {
    # Recover the mailbox databases after an unclean stop. A container gets
    # killed rather than shut down, so this is the normal case, not the
    # exception.
    recover     cmd="ctl_cyrusdb -r"
}

SERVICES {
    # IMAP with STARTTLS. `allowplaintext: no` means a credential cannot cross
    # this port before STARTTLS.
    imap        cmd="imapd"     listen="0.0.0.0:143"    prefork=1
    # Implicit TLS. The port M1 uses.
    imaps       cmd="imapd -s"  listen="0.0.0.0:993"    prefork=1
    # ManageSieve, STARTTLS. M3 uses this.
    sieve       cmd="timsieved" listen="0.0.0.0:4190"   prefork=0
    # Local delivery from Postfix.
    lmtpunix    cmd="lmtpd"     listen="/run/cyrus/socket/lmtp"  prefork=0
}

EVENTS {
    checkpoint  cmd="ctl_cyrusdb -c" period=30
    delprune    cmd="cyr_expire -E 3" at=0400
}

# Cyrus IMAP — test environment.
#
# Modelled on the production configuration, with the two deliberate differences
# from architecture 12.2 marked below.

configdirectory:    /var/lib/cyrus
partition-default:  /var/spool/cyrus
sievedir:           /var/spool/sieve
sendmail:           /usr/sbin/sendmail
hashimapspool:      true
duplicatesuppression: false

# The administrator. Cyrus authenticates its admins through the same saslauthd
# as everyone else, so `cyrus` needs a row in `accountuser` — the fixtures have
# one. That is how production works too.
admins:             cyrus

# ---------------------------------------------------------------------------
# Namespace. Both matter for the naming scheme (architecture 3.3):
#
#   unixhierarchysep  the separator is `/`, so a dot in `anna.example.test` is
#                     part of the name and not a folder boundary
#   virtdomains       `hans@beispiel.invalid` lands in the virtual domain
#                     namespace, `anna.example.test` in the flat one
#
# Both spellings therefore coexist, which is exactly the situation the
# application has to survive.
# ---------------------------------------------------------------------------
unixhierarchysep:   yes
virtdomains:        userid

# Domains under which a login with an `@` is accepted. In production this list
# comes from Salt and drifts from the database (E-9); here it is written by hand
# and covers the fixture domains. `beispiel.invalid` has to be in it or the fqun
# accounts cannot log in at all.
loginrealms:        example.test beispiel.invalid leer.test

# ---------------------------------------------------------------------------
# DELIBERATELY DIFFERENT FROM PRODUCTION (architecture 12.2, finding S-13)
#
# Production has `autocreate_quota: 0`, which means: create an INBOX on first
# login. A user who logs in with the wrong spelling then silently gets a second,
# empty mailbox while their mail stays in the first one. 33 such shadow
# mailboxes exist in production and webcyradm never showed them.
#
# -1 switches autocreate off. A login with the wrong naming scheme has to fail
# here instead of papering over itself.
# ---------------------------------------------------------------------------
autocreate_quota:   -1

# ---------------------------------------------------------------------------
# ALSO DELIBERATELY DIFFERENT FROM PRODUCTION
#
# Cyrus defaults to `delete_mode: delayed`: DELETE does not remove the mailbox
# but renames it to `DELETED/<name>/<hex seconds since the epoch>`, to be
# expunged later. The name is freed either way, so the application behaves the
# same — but the *target* name only changes once a second, and a test suite
# creating and deleting the same mailbox at machine speed collides on it. Cyrus
# then refuses the second delete with, of all things, "Mailbox already exists",
# and every later assertion in that run is about leftovers.
#
# `immediate` removes that one source of flakiness. Nothing else depends on it:
# the adapter filters the `DELETED/` namespace out of listings regardless, and
# that filtering is asserted in a unit test against a scripted server rather
# than here — see CyrusMailstoreTest. The retry case the delayed mode produces
# is covered by MailboxOperationFailed::deletionRefused().
# ---------------------------------------------------------------------------
delete_mode:        immediate

# ---------------------------------------------------------------------------
# NOT a test-only setting — the production server needs this too.
#
# Cyrus defaults `allowusermoves` to **no**, and with it off *every* rename of a
# user mailbox is refused with "Operation is not supported on mailbox" — not
# just across domains, but `RENAME user/a user/b` outright.
#
# Architecture 8.1 requires exactly that operation: renaming a domain and
# switching an account's naming scheme (E-14) are both `renamemailbox` across
# the affected accounts, and the rule there is that changing only the database
# leaves the account unreachable. Without this line mailadmin can do the
# database half and never the mailbox half — which is precisely the legacy
# system's bug, reproduced by configuration.
#
# So it belongs in the deployment documentation as a prerequisite, not only
# here. See docs/deployment/.
# ---------------------------------------------------------------------------
allowusermoves:     yes

# ---------------------------------------------------------------------------
# Authentication and TLS
# ---------------------------------------------------------------------------
sasl_pwcheck_method: saslauthd
sasl_mech_list:      PLAIN LOGIN

# No credential over an unencrypted connection — finding S-5. The old admin
# client spoke plaintext on port 143; this refuses to let it.
allowplaintext:      no
allowapop:           no

tls_server_cert:     /etc/ssl/mailadmin/server.crt
tls_server_key:      /etc/ssl/mailadmin/server.key
tls_client_ca_file:  /etc/ssl/mailadmin/ca.crt
tls_versions:        tls1_2 tls1_3

# Not optional, and not obvious: Cyrus 3.10 defaults `allowstarttls` to **no**,
# and `tls_starttls_enabled()` is `allowstarttls && tls_enabled()`. Without this
# line the certificate above is configured, IMAPS on 993 works — and STARTTLS is
# not merely unadvertised but an unrecognised command on both 143 and 4190.
#
# That matters beyond convenience: timsieved has no implicit-TLS port in Cyrus's
# default configuration, so ManageSieve (M3) is reachable *only* through
# STARTTLS. Without this, M3 would have to choose between no Sieve and a
# credential in the clear, and finding S-5 says which one it would not choose.
#
# It does not weaken anything. `allowplaintext: no` still forbids a credential
# before the handshake, which is why port 143 keeps advertising LOGINDISABLED
# until STARTTLS has run.
allowstarttls:       yes

# Everything to stderr, where supervisord picks it up and `docker compose logs`
# shows it.
syslog_prefix:       cyrus
debug:               1

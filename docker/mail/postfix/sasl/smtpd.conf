# Cyrus SASL for the Postfix smtpd. Same saslauthd, same PAM stack, same
# `allusers` view as Cyrus IMAP — that is the whole point of the chain.
#
# The PAM service name saslauthd is handed for this application is `smtp`, so
# the stack that decides is /etc/pam.d/smtp.
pwcheck_method: saslauthd
mech_list: PLAIN LOGIN

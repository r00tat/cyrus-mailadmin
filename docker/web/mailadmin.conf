# The U-25 deployment model, reproduced: DocumentRoot is the *project* root, not
# public/. Everything that keeps src/, config/, docker/ and the rest out of
# reach is the .htaccess files in the tree — which is why AllowOverride is All.
#
# If this environment ever serves a file it should not, the layer that failed is
# the same layer that would fail on the production host.

ServerName mail.example.test
ServerTokens Prod
ServerSignature Off

DocumentRoot /var/www/mailadmin

<Directory /var/www/mailadmin>
    # The whole point. AllowOverride None here would make every .htaccess in the
    # project inert — the residual risk U-25 names, and something worth being
    # able to reproduce by changing this one word.
    AllowOverride All
    Options -Indexes -MultiViews
    Require all granted
</Directory>

# PHP through FPM in the app container.
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://app:9000"
</FilesMatch>

DirectoryIndex index.php index.html

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
LogLevel warn

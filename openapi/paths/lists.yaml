#
# Mailing lists (A5). See `openapi/README.md` for the file conventions and
# `docs/03-architektur.md`, section 7.2, for where this resource sits.
#
# Five operations over two legacy tables: the row in `lists` and the entry in
# `virtual` that routes the list address. A list is identified by its address;
# `name` is display text and may repeat (spec 4.3, "Identität").
#
# Superusers reach every list, domain masters the lists of their own domains
# (`list.read`, `list.write`, `list.delete`). A list outside the actor's domains
# is `404`, indistinguishable from one that does not exist (U-44); creating one
# in a foreign domain is `403`, because there is no object a `404` could hide.
#
tags:
  - name: mailing-lists
    description: |
      Mailing lists — the `lists` table, made editable.

      **webcyradm never showed this table.** It is written today by an external
      tool and read by the configuration management, which renders it into an
      aliases file (analysis 4.1 and 6). This package makes it visible and
      editable; it does not take over the rendering, and it does not become
      mailing list software — no subscriptions, no archives, no bounce handling.

      Two consequences a client has to carry:

        * while the legacy alias file is still rendered, creating and deleting
          a list answer with `X-Mailadmin-Effect: pending-configuration-run`:
          the list delivers, or stops, at once, but the aliases file only
          follows with the next configuration run. A change to name, tag or
          members is live at once and carries no header; on the transport path
          no answer carries it;
        * rows that were written before this application existed may contain
          values it would not accept. They are shown and flagged
          (`unusable_members`, `address_usable`), never filtered out and never
          silently corrected (U-22).

paths:
  /lists:
    get:
      operationId: listMailingLists
      tags:
        - mailing-lists
      summary: List mailing lists
      description: |
        One page of mailing lists (U-20).

        Sorting is over an enumeration, never a free string, and so is the
        direction. A filter the schema does not describe is answered with `422`
        rather than ignored: a request asking for a subset that quietly gets
        everything is worse than one that fails.
      x-permission: list.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/MailingListSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/MailingListNameFilter'
        - $ref: '#/components/parameters/MailingListTagFilter'
        - $ref: '#/components/parameters/MailingListAddressFilter'
        - $ref: '#/components/parameters/MailingListMemberFilter'
      responses:
        '200':
          description: A page of mailing lists. An empty page is a `200`, not a `404`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingListCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      operationId: createMailingList
      tags:
        - mailing-lists
      summary: Create a mailing list
      description: |
        Writes the row to `lists` and then the entry in `virtual` that routes
        the address. Nothing is created in the mail store — a mailing list has
        no mailbox.

        The address has to be free: not another list, not an address in
        `virtual` of any kind, and not a list with the same list key. Otherwise
        the answer is `409` with `list.address_taken`. Its domain has to be one
        this application manages (`list.unknown_domain`), and its local part
        must not carry a recipient delimiter (`list.address_has_extension`).

        A domain master may create lists in their own domains only. Any other
        domain is `403` — not `404`, because no existing object is being hidden.

        The address delivers at once on either delivery path: its `virtual`
        entry routes to the pipe transport. On the legacy alias path the
        aliases file gains the list's line only with the next configuration
        run, and the answer carries `X-Mailadmin-Effect` to say so.

        Every member has to be a mail address. That is a security rule, not
        validation: the column is rendered into an aliases file, where `|command`
        and `/path/to/file` name a command and a file rather than a recipient.
      x-permission: list.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailingListCreateRequest'
      responses:
        '201':
          description: |
            Created. `Location` names the new list and `ETag` is its validator,
            so that the next change can send `If-Match` without a round trip.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Mailadmin-Effect:
              $ref: '#/components/headers/MailingListEffect'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The address lies in a domain outside the actor's domains, or the
            actor lacks `list.write`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The address is in use — as a list, as an address in `virtual`, or through a list with the same list key (`list.address_taken`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /lists/{address}:
    parameters:
      - $ref: '#/components/parameters/MailingListAddress'

    get:
      operationId: getMailingList
      tags:
        - mailing-lists
      summary: One mailing list
      description: |
        Answers with an `ETag` over exactly the fields below (U-19) — a hash of
        the representation, not of the database row, so that a column the
        external tool writes in parallel does not invalidate an administrator's
        `If-Match`.

        A domain master reads the lists of their own domains. Any other list
        is `404`, the same answer as a list that does not exist (U-44).
      x-permission: list.read
      responses:
        '200':
          description: The list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      operationId: updateMailingList
      tags:
        - mailing-lists
      summary: Change a mailing list
      description: |
        **A field the request does not mention is left alone.** `{"tag": "team"}`
        changes the tag and does not touch the members; `{"members": []}` empties
        the member list.

        A list saved without changing its membership is written back byte for
        byte — the stored separator and spacing survive, and a `NULL` stays
        `NULL`. That matters because `lists` is also written by another tool and
        the exact form of the existing rows was never captured (U-56).

        `name`, `tag` and `members` can be changed; the address cannot. It
        identifies the list, so moving a list is a delete and a create. A body
        that names `address` — or any other field the schema does not list —
        is `422`. Only `lists` is written; the entry in `virtual` stays as it is.
        The change is live at once on either delivery path — the delivery
        script reads the list at delivery time — so the answer never carries
        `X-Mailadmin-Effect`.

        A domain master changes the lists of their own domains; any other list
        is `404`.

        `If-Match` is accepted, not demanded. Sent and stale, the answer is
        `412`; absent, the write proceeds (architecture 7.1).
      x-permission: list.write
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailingListUpdateRequest'
      responses:
        '200':
          description: The list as it now stands, with its new validator.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: deleteMailingList
      tags:
        - mailing-lists
      summary: Delete a mailing list
      description: |
        Removes the entry in `virtual` first, so that no more mail reaches the
        list, and then the row in `lists`. A `lists` row that cannot be removed
        goes to the repair queue and the answer is still `204`: without the
        `virtual` entry the list is already unreachable. Nothing is removed from
        the mail store, because nothing was ever created there.

        Mail to the address stops at once on either delivery path. On the
        legacy alias path the aliases file keeps the list's line until the
        configuration management next runs; the answer then carries
        `X-Mailadmin-Effect` although it has no body.

        A domain master deletes the lists of their own domains; any other list
        is `404`.

        `If-Match` is accepted here too: deleting the wrong version of a list is
        exactly as damaging as overwriting it.
      x-permission: list.delete
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted. No body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Mailadmin-Effect:
              $ref: '#/components/headers/MailingListEffect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
